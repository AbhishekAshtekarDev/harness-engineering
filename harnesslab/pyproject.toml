[project]
name = "harnesslab"
version = "0.1.0"
description = "A small, readable agent harness for learning harness engineering."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harnesslab*"]
