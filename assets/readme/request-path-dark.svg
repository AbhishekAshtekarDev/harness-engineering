<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d"><title id="t">How a request passes through an agent harness</title><desc id="d">A task becomes context for the model. The model proposes a tool call; the harness checks permissions, runs it in a sandbox, records it in a trace and returns the result. When the agent says it is done, verification either accepts the work or sends the failure back.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6f94"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4ff3f"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker></defs><rect width="1280" height="470" rx="18" fill="#0b1324"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="36" y="52" font-size="14" fill="#d4ff3f" font-weight="750" text-anchor="start" letter-spacing="2">EVERY ACTION GOES THROUGH THE HARNESS</text><text x="36" y="84" font-size="20" fill="#f0f3f8" font-weight="600" text-anchor="start">The model only proposes. The harness decides, runs, records and checks.</text><rect x="36" y="150" width="150" height="96" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><text x="111.0" y="192" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Task</text><text x="111.0" y="218" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">a ticket or request</text><line x1="190" y1="198.0" x2="220" y2="198.0" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><rect x="226" y="150" width="190" height="96" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><text x="321.0" y="192" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Context</text><text x="321.0" y="218" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">instructions, files, history</text><line x1="420" y1="198.0" x2="450" y2="198.0" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><rect x="456" y="150" width="150" height="96" rx="14" fill="#d4ff3f" stroke="#d4ff3f" stroke-width="1.5"/><text x="531.0" y="192" font-size="19" fill="#0b1324" font-weight="750" text-anchor="middle">Model</text><text x="531.0" y="218" font-size="13.5" fill="#0b1324" font-weight="500" text-anchor="middle">decides the next step</text><line x1="610" y1="198.0" x2="640" y2="198.0" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><rect x="646" y="150" width="190" height="96" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><text x="741.0" y="192" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Permission check</text><text x="741.0" y="218" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">is this call allowed?</text><line x1="840" y1="198.0" x2="870" y2="198.0" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><rect x="876" y="150" width="168" height="96" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><text x="960.0" y="192" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Sandbox</text><text x="960.0" y="218" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">runs the tool call</text><line x1="1048" y1="198.0" x2="1078" y2="198.0" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><rect x="1084" y="150" width="160" height="96" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><text x="1164.0" y="192" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Trace</text><text x="1164.0" y="218" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">records what happened</text><path d="M1164 146 C1164 110, 531 110, 531 144" fill="none" stroke="#d4ff3f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-acc)"/><text x="848" y="112" font-size="14" fill="#d4ff3f" font-weight="650" text-anchor="middle">the result goes back into the model&#x27;s context</text><line x1="531" y1="250" x2="531" y2="324" stroke="#5c6f94" stroke-width="2" marker-end="url(#arrow)"/><text x="543" y="300" font-size="13" fill="#6f7f9c" font-weight="600" text-anchor="start">agent says done</text><rect x="416" y="330" width="230" height="92" rx="14" fill="#121c33" stroke="#d4ff3f" stroke-width="2"/><text x="531" y="370" font-size="19" fill="#f0f3f8" font-weight="750" text-anchor="middle">Verification</text><text x="531" y="396" font-size="13.5" fill="#a9b6cf" font-weight="500" text-anchor="middle">tests and checks it cannot skip</text><line x1="650" y1="376" x2="796" y2="376" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-good)"/><text x="723" y="366" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">pass</text><rect x="800" y="338" width="210" height="76" rx="14" fill="#0f2a1c" stroke="#3fb950" stroke-width="1.5"/><text x="905" y="372" font-size="18" fill="#3fb950" font-weight="750" text-anchor="middle">Work accepted</text><text x="905" y="394" font-size="13" fill="#a9b6cf" font-weight="500" text-anchor="middle">with evidence attached</text><path d="M412 376 C300 376, 300 198.0, 452 220.0" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><text x="250" y="360" font-size="13" fill="#ff7b72" font-weight="650" text-anchor="middle">fail: the exact</text><text x="250" y="378" font-size="13" fill="#ff7b72" font-weight="650" text-anchor="middle">failure goes back</text></g></svg>