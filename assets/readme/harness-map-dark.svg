<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="t d"><title id="t">Agent = Model + Harness: the eight parts of a harness</title><desc id="d">The model sits inside the agent loop. Around it, eight harness parts: guidance, capability, boundaries, continuity, checking, visibility, correction and control flow, each with its lesson.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6f94"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4ff3f"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker></defs><rect width="1280" height="620" rx="18" fill="#0b1324"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><g transform="translate(640 310)" text-anchor="middle"><circle r="181.4" fill="#d4ff3f" opacity="0.07"/><circle r="163.4" fill="none" stroke="#2f4470" stroke-width="2"/><circle r="106.39999999999999" fill="none" stroke="#d4ff3f" stroke-width="2" stroke-dasharray="6 6"/><circle r="49.4" fill="#d4ff3f"/><text x="0" y="6.6499999999999995" font-size="17.099999999999998" fill="#0b1324" font-weight="800" text-anchor="middle">MODEL</text><text x="0" y="-116.39999999999999" font-size="12.35" fill="#d4ff3f" font-weight="700" text-anchor="middle" letter-spacing="2">AGENT LOOP</text></g><text x="640" y="506" font-size="13" fill="#a9b6cf" font-weight="700" text-anchor="middle" letter-spacing="2">THE HARNESS</text><rect x="36" y="27" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="36" y="45" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="62" y="67" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Guidance</text><rect x="286" y="45" width="106" height="24" rx="12" fill="#0b1324"/><text x="339.0" y="61.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lessons 4, 5</text><text x="62" y="99" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">What the agent is told:</text><text x="62" y="123" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">instructions, AGENTS.md, context</text><path d="M408 88.0 L577.2 158.5" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="577.2" cy="158.5" r="5" fill="#d4ff3f"/><rect x="872" y="27" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="872" y="45" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="898" y="67" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Capability</text><rect x="1151" y="45" width="77" height="24" rx="12" fill="#0b1324"/><text x="1189.5" y="61.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 6</text><text x="898" y="99" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">What it can do:</text><text x="898" y="123" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">tools, MCP servers, skills</text><path d="M872 88.0 L702.8 158.5" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="702.8" cy="158.5" r="5" fill="#d4ff3f"/><rect x="872" y="175" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="872" y="193" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="898" y="215" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Boundaries</text><rect x="1151" y="193" width="77" height="24" rx="12" fill="#0b1324"/><text x="1189.5" y="209.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 7</text><text x="898" y="247" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">Where it runs, what it may touch:</text><text x="898" y="271" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">sandbox, permissions, secrets</text><path d="M872 236.0 L791.5 247.2" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="791.5" cy="247.2" r="5" fill="#d4ff3f"/><rect x="872" y="323" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="872" y="341" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="898" y="363" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Continuity</text><rect x="1151" y="341" width="77" height="24" rx="12" fill="#0b1324"/><text x="1189.5" y="357.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 8</text><text x="898" y="395" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">What survives a session:</text><text x="898" y="419" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">state, memory, progress files</text><path d="M872 384.0 L791.5 372.8" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="791.5" cy="372.8" r="5" fill="#d4ff3f"/><rect x="872" y="471" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="872" y="489" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="898" y="511" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Checking</text><rect x="1151" y="489" width="77" height="24" rx="12" fill="#0b1324"/><text x="1189.5" y="505.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 9</text><text x="898" y="543" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">How its work is judged:</text><text x="898" y="567" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">guardrails, tests, evals</text><path d="M872 532.0 L702.8 461.5" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="702.8" cy="461.5" r="5" fill="#d4ff3f"/><rect x="36" y="471" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="36" y="489" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="62" y="511" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Visibility</text><rect x="308" y="489" width="84" height="24" rx="12" fill="#0b1324"/><text x="350.0" y="505.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 10</text><text x="62" y="543" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">What gets recorded:</text><text x="62" y="567" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">logs, traces, cost, metrics</text><path d="M408 532.0 L577.2 461.5" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="577.2" cy="461.5" r="5" fill="#d4ff3f"/><rect x="36" y="323" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="36" y="341" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="62" y="363" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Correction</text><rect x="308" y="341" width="84" height="24" rx="12" fill="#0b1324"/><text x="350.0" y="357.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lesson 11</text><text x="62" y="395" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">How a mistake becomes a rule:</text><text x="62" y="419" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">feedback, verification, steering</text><path d="M408 384.0 L488.5 372.8" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="488.5" cy="372.8" r="5" fill="#d4ff3f"/><rect x="36" y="175" width="372" height="122" rx="14" fill="#121c33" stroke="#2a3a5c" stroke-width="1.5"/><rect x="36" y="193" width="5" height="86" rx="2.5" fill="#d4ff3f"/><text x="62" y="215" font-size="22" fill="#f0f3f8" font-weight="750" text-anchor="start">Control flow</text><rect x="272" y="193" width="120" height="24" rx="12" fill="#0b1324"/><text x="332.0" y="209.32" font-size="12" fill="#a9b6cf" font-weight="650" text-anchor="middle">Lessons 12, 13</text><text x="62" y="247" font-size="16" fill="#a9b6cf" font-weight="400" text-anchor="start">When it goes on or stops:</text><text x="62" y="271" font-size="16" fill="#f0f3f8" font-weight="550" text-anchor="start">loops, graphs, human approval</text><path d="M408 236.0 L488.5 247.2" stroke="#2f4470" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/><circle cx="488.5" cy="247.2" r="5" fill="#d4ff3f"/></g></svg>