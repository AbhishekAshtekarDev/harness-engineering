<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d"><title id="t">The same agent with and without a harness</title><desc id="d">Without a harness the agent uses the UTC date, edits shared config, passes its own tests and ships a time-zone bug. With a harness a lint rule, a path guard and hidden acceptance tests catch each mistake.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4d7c0f"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker></defs><rect width="1280" height="600" rx="18" fill="#f6f8fa"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="640" y="52" font-size="14" fill="#4d7c0f" font-weight="750" text-anchor="middle" letter-spacing="2">SAME MODEL, SAME TASK: ADD A WEEKLY STREAK TO A HABIT TRACKER</text><rect x="36" y="80" width="592" height="494" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><rect x="36" y="80" width="592" height="58" rx="14" fill="#ffebe9"/><rect x="36" y="124" width="592" height="14" fill="#ffebe9"/><text x="64" y="117" font-size="22" fill="#cf222e" font-weight="800" text-anchor="start">Without a harness</text><circle cx="80" cy="184" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><path d="M74 178 l12 12 M86 178 l-12 12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="182" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Writes the date logic with .date()</text><text x="112" y="206" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">Nothing told it about the time-zone helper</text><path d="M80 202 V228" stroke="#d0d7de" stroke-width="2"/><circle cx="80" cy="256" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><path d="M74 250 l12 12 M86 250 l-12 12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="254" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Edits config/settings.toml</text><text x="112" y="278" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">Nothing stopped it touching shared config</text><path d="M80 274 V300" stroke="#d0d7de" stroke-width="2"/><circle cx="80" cy="328" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><path d="M74 322 l12 12 M86 322 l-12 12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="326" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Runs its own tests, and they pass</text><text x="112" y="350" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">It wrote them, so they share its blind spot</text><path d="M80 346 V372" stroke="#d0d7de" stroke-width="2"/><circle cx="80" cy="400" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><path d="M74 394 l12 12 M86 394 l-12 12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="398" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Reports that the work is done</text><text x="112" y="422" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">You take its word for it</text><path d="M80 418 V444" stroke="#d0d7de" stroke-width="2"/><circle cx="80" cy="472" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><path d="M74 466 l12 12 M86 466 l-12 12" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="112" y="470" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">A week later</text><text x="112" y="494" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">Users in Tokyo lose their streaks</text><path d="M60 520 H604" stroke="#d0d7de"/><text x="64" y="553" font-size="17" fill="#cf222e" font-weight="700" text-anchor="start">Result: You clean up after the agent</text><rect x="652" y="80" width="592" height="494" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><rect x="652" y="80" width="592" height="58" rx="14" fill="#dafbe1"/><rect x="652" y="124" width="592" height="14" fill="#dafbe1"/><text x="680" y="117" font-size="22" fill="#1a7f37" font-weight="800" text-anchor="start">With a harness</text><circle cx="696" cy="184" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M689 184 l5 5 l9 -10" stroke="#1a7f37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="728" y="182" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">A lint rule flags .date() after the edit</text><text x="728" y="206" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">The message names the helper to use</text><path d="M696 202 V228" stroke="#d0d7de" stroke-width="2"/><circle cx="696" cy="256" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M689 256 l5 5 l9 -10" stroke="#1a7f37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="728" y="254" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">The path guard blocks the config edit</text><text x="728" y="278" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">config/* is protected, so the write fails</text><path d="M696 274 V300" stroke="#d0d7de" stroke-width="2"/><circle cx="696" cy="328" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M689 328 l5 5 l9 -10" stroke="#1a7f37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="728" y="326" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Hidden acceptance tests run</text><text x="728" y="350" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">One fails: the current week breaks the streak</text><path d="M696 346 V372" stroke="#d0d7de" stroke-width="2"/><circle cx="696" cy="400" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M689 400 l5 5 l9 -10" stroke="#1a7f37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="728" y="398" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">The agent fixes it from the failure report</text><text x="728" y="422" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">Verification passes on the next try</text><path d="M696 418 V444" stroke="#d0d7de" stroke-width="2"/><circle cx="696" cy="472" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M689 472 l5 5 l9 -10" stroke="#1a7f37" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="728" y="470" font-size="17" fill="#1f2328" font-weight="650" text-anchor="start">Every step is in the trace</text><text x="728" y="494" font-size="15" fill="#59636e" font-weight="400" text-anchor="start">You review a diff, not a mystery</text><path d="M676 520 H1220" stroke="#d0d7de"/><text x="680" y="553" font-size="17" fill="#1a7f37" font-weight="700" text-anchor="start">Result: You review work that is already verified</text></g></svg>