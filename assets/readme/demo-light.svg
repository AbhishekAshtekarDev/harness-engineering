<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d"><title id="t">harnesslab demo output</title><desc id="d">The scripted agent makes four realistic mistakes. A lint sensor, a protected path, a deny rule and hidden acceptance tests catch them, and the run ends only when verification passes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4d7c0f"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker></defs><rect width="1280" height="560" rx="18" fill="#f6f8fa"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="24" y="24" width="1232" height="512" rx="14" fill="#0b1324" stroke="#d0d7de"/><circle cx="54" cy="54" r="7" fill="#ff5f57"/><circle cx="78" cy="54" r="7" fill="#febc2e"/><circle cx="102" cy="54" r="7" fill="#28c840"/><text x="640" y="59" font-size="14" fill="#8fa0bf" font-weight="600" text-anchor="middle">harnesslab demo: a scripted agent inside the full harness, no API key</text><text x="56" y="106" font-size="16" fill="#d4ff3f" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">$ python -m harnesslab demo</text><text x="56" y="138" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">agent: Adding weekly_streak next to daily_streak.</text><text x="56" y="170" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">tool edit_file ok: Edited habit_tracker/streaks.py</text><text x="56" y="202" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">agent: The lint rule says .date() gives the UTC day. I&#x27;ll read the time helpers.</text><rect x="1157" y="183" width="67" height="26" rx="13" fill="#d4ff3f"/><text x="1190.5" y="200.32" font-size="12" fill="#0b1324" font-weight="800" text-anchor="middle">SENSOR</text><text x="56" y="234" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">agent: I&#x27;ll also add a feature flag so the team can turn weekly streaks off.</text><text x="56" y="266" font-size="16" fill="#ff8a80" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">tool edit_file ERROR: &#x27;config/settings.toml&#x27; is protected (matches config/*)</text><rect x="1141" y="247" width="83" height="26" rx="13" fill="#d4ff3f"/><text x="1182.5" y="264.32" font-size="12" fill="#0b1324" font-weight="800" text-anchor="middle">BOUNDARY</text><text x="56" y="298" font-size="16" fill="#ff8a80" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">blocked (deny): destructive deletes are not allowed</text><rect x="1125" y="279" width="99" height="26" rx="13" fill="#d4ff3f"/><text x="1174.5" y="296.32" font-size="12" fill="#0b1324" font-weight="800" text-anchor="middle">PERMISSION</text><text x="56" y="330" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">tool run_tests ok: All tests passed (10 passed in 0.01s).</text><text x="56" y="362" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">agent: Done. Changed habit_tracker/streaks.py and added tests. All tests pass.</text><text x="56" y="394" font-size="16" fill="#ff8a80" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">verify: FAIL acceptance + held-out tests: 1 failed, 4 passed</text><rect x="1109" y="375" width="115" height="26" rx="13" fill="#d4ff3f"/><text x="1166.5" y="392.32" font-size="12" fill="#0b1324" font-weight="800" text-anchor="middle">VERIFICATION</text><text x="56" y="426" font-size="16" fill="#e6ecf7" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">agent: Verification shows an unfinished current week breaks my streak. Fixing...</text><text x="56" y="458" font-size="16" fill="#7ee787" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">verify: PASS</text><text x="56" y="490" font-size="16" fill="#7ee787" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" style="font-variant-ligatures:none" xml:space="preserve">[succeeded] verification passed</text></g></svg>