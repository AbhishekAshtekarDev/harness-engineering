      - 05 Loop controls: projects/05-loop-controls/index.md
      - 06 Guides and sensors: projects/06-guides-and-sensors/index.md
      - 07 Traces and diagnosis: projects/07-traces-and-diagnosis/index.md
      - 08 Evals: projects/08-evals/index.md
      - 09 Graph workflow: projects/09-graph-workflow/index.md
      - 10 Capstone: projects/10-capstone-full-harness/index.md
