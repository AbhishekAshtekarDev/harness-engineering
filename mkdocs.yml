site_name: Harness Engineering Course
site_description: A free, open-source harness engineering course with 18 lessons, 11 tested Python projects, 12 videos and a runnable agent harness for building reliable AI agents.
site_url: https://abhishekashtekardev.github.io/harness-engineering/
site_author: Abhishek Ashtekar
repo_url: https://github.com/AbhishekAshtekarDev/harness-engineering
repo_name: harness-engineering
edit_uri: ""
docs_dir: docs
copyright: Code MIT · Content CC BY 4.0 · Abhishek Ashtekar

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: lime
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      accent: lime
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  verification: {}
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AbhishekAshtekarDev/harness-engineering
      name: Harness engineering course on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Course:
      - course/index.md
      - Foundations:
          - What Harness Engineering Is: course/01-what-is-harness-engineering.md
          - How an AI Agent Works: course/02-how-an-agent-works.md
          - From Prompt Engineering to Harness Engineering: course/03-the-layers.md
      - Guidance:
          - Instructions and AGENTS.md: course/04-instructions-and-agents-md.md
          - Context Engineering for Harnesses: course/05-context-engineering.md
      - Capability:
          - Tools, MCP and Agent Skills: course/06-tools-mcp-and-skills.md
      - Boundaries:
          - Sandboxes, Permissions and Security: course/07-sandboxes-permissions-and-security.md
      - Continuity:
          - State, Memory and Long-Running Work: course/08-state-memory-and-long-running-work.md
      - Checking and Visibility:
          - Guardrails, Tests and Evals: course/09-guardrails-tests-and-evals.md
          - Logs, Traces and Observability: course/10-observability.md
      - Correction:
          - Feedback, Verification and the Steering Loop: course/11-feedback-verification-and-steering.md
      - Control Flow:
          - Loop Engineering: course/12-loop-engineering.md
          - Graphs and Multi-Agent Systems: course/13-graphs-and-multi-agent-systems.md
      - Putting It Together:
          - Build a Complete Harness: course/14-build-a-complete-harness.md
          - Diagnosing Agent Failures: course/15-diagnosing-agent-failures.md
          - Harness Engineering in Production: course/16-harness-engineering-in-production.md
          - Harnesses Beyond Coding: course/17-harnesses-beyond-coding.md
          - Case Studies from Real Teams: course/18-case-studies.md
  - Videos: videos/index.md
  - Projects:
      - projects/index.md
      - Build an Agent Loop from Scratch: projects/01-agent-loop/index.md
      - Design Tools an Agent Can Use: projects/02-tool-design/index.md
      - Permissions and a Sandbox: projects/03-permissions-and-sandbox/index.md
      - Make Work Survive Across Sessions: projects/04-long-running-state/index.md
      - Loop Controls That Stop for a Reason: projects/05-loop-controls/index.md
      - Guides and Sensors: projects/06-guides-and-sensors/index.md
      - Read Traces and Diagnose Failures: projects/07-traces-and-diagnosis/index.md
      - Build an Eval Kit: projects/08-evals/index.md
      - A Graph Workflow with Human Approval: projects/09-graph-workflow/index.md
      - "Capstone: Run, Ablate and Improve a Full Harness": projects/10-capstone-full-harness/index.md
      - A Harness for a Support Agent That Moves Money: projects/11-support-agent-harness/index.md
      - The harnesslab Library: harnesslab/index.md
      - The Example App: examples/habit-tracker/index.md
  - Reference:
      - reference/index.md
      - Harness Checklist: reference/harness-checklist.md
      - Failure Diagnosis Table: reference/failure-diagnosis.md
      - Glossary: reference/glossary.md
      - Frameworks Map: reference/frameworks-map.md
      - Templates: reference/templates/index.md
      - Reading List: reference/reading-list.md
      - FAQ: reference/faq.md
      - The harness-review Agent Skill: skills/index.md
  - Contributing: CONTRIBUTING.md
