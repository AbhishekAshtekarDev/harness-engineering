name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        exclude:
          # Python 3.10 is not preinstalled on Apple-silicon macOS runners; 3.10 is covered on Linux and Windows.
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest tzdata langgraph
      - name: harnesslab
        run: python -m pytest -q harnesslab/tests
      - name: habit-tracker example
        run: python -m pytest -q examples/habit-tracker
      - name: project solutions
        shell: bash
        run: |
          for d in projects/*/; do
            if ls "$d"test_*.py >/dev/null 2>&1; then
              (cd "$d" && SOLUTION=1 python -m pytest -q) || exit 1
            fi
          done
      - name: prose style
        run: python tools/style_check.py
